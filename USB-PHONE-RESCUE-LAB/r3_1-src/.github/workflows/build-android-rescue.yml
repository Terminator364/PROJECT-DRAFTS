# Install this only at the ROOT of a standalone repository containing android/ + tests/.
# The connected PROJECT-DRAFTS repo has a separate manual workflow for the nested R3.1 path.
name: BCP USB Rescue R3.1 (standalone manual APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression suite before installing Android components
        shell: bash
        run: python3 -m unittest discover -s tests -q
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK metadata and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-cert.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-package.txt
          grep -F "name='com.blessing.rescuebridge'" apk-package.txt
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BCP-USB-Rescue-R3_1-DEBUG-not-durable-signed
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-cert.txt
            apk-package.txt
            apk-sha256.txt
          retention-days: 7
          if-no-files-found: error