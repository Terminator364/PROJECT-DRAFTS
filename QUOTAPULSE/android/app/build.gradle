plugins { id 'com.android.application' }
android {
    namespace 'com.quotapulse.monitor'
    compileSdk 35
    defaultConfig {
        applicationId 'com.quotapulse.monitor.stable'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0-beta'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        stable {
            storeFile file('quotapulse-release.p12')
            storePassword System.getenv('QP_SIGN_PASS') ?: 'not-set'
            keyAlias 'quotapulse'
            keyPassword System.getenv('QP_SIGN_PASS') ?: 'not-set'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
        debug { debuggable true }
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
