name: QuotaPulse one-off UNSIGNED Android APK
on:
  push:
    branches: [quotapulse-unsigned-signoff-20261108]
    paths: [.github/workflows/quotapulse-once-unsigned-20261108.yml]
permissions:
  contents: write
jobs:
  unsigned_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install minimal Android toolchain in runner
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests and assemble UNSIGNED release
        run: gradle --no-daemon --console=plain -p QUOTAPULSE/android clean testDebugUnitTest assembleRelease
      - name: Confirm release is unsigned and compute digest
        shell: bash
        run: |
          set -euo pipefail
          APK="QUOTAPULSE/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"; then
            echo "ERROR: APK unexpectedly signed" >&2
            exit 4
          fi
          sha256sum "$APK"
          ls -l "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaPulse-v0.5.0-UNSIGNED-needs-private-key
          path: QUOTAPULSE/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 2
      - name: Upload unsigned release as a temporary signing input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="quotapulse-v0.5.0-unsigned"
          APK="QUOTAPULSE/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "QuotaPulse v0.5.0 unsigned - NOT INSTALLABLE" --notes "Unsigned compilation input for signing with the existing private production certificate. Not an installable Android application. No keys or user data included."
          fi
          gh release upload "$TAG" "$APK#QuotaPulse-v0.5.0-unsigned.apk" --repo "$GITHUB_REPOSITORY" --clobber
