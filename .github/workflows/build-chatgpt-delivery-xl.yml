name: Build ChatGPT Delivery XL

on:
  push:
    paths:
      - 'CHATGPT-DELIVERY-XL/**'
      - '.github/workflows/build-chatgpt-delivery-xl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r CHATGPT-DELIVERY-XL/requirements.txt
          pip install pyinstaller
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name ChatGPT-Delivery-XL --collect-all telethon --hidden-import=win32timezone CHATGPT-DELIVERY-XL/worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Delivery-XL-Windows
          path: dist/ChatGPT-Delivery-XL.exe
          if-no-files-found: error
