name: QuotaPulse 0.6 one-shot visual UI emulator QA
on:
  push:
    branches: [quotapulse-visual-emulator-20261108]
    paths: [.github/workflows/quotapulse-ui-emulator-once.yml]
permissions:
  contents: write
jobs:
  pixel-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 35 build platform
        run: |
          set -euo pipefail
          S="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          "$S" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile QA APK and run unit tests
        run: gradle --no-daemon --console=plain -p QUOTAPULSE/android testDebugUnitTest assembleDebug
      - name: Enable /dev/kvm
        run: |
          KVM=/dev/kvm
          if [ -e "$KVM" ]; then sudo chmod a+rw "$KVM"; fi
      - name: Boot Android emulator, exercise two screen sizes and capture native UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p /tmp/quotapulse-visuals
            PKG=com.quotapulse.monitor.stable
            adb install -r QUOTAPULSE/android/app/build/outputs/apk/debug/app-debug.apk
            NOW="$(date +%s%3N)"
            PREV="$((NOW - 60000))"
            cat > /tmp/qp-fixture.xml <<EOF
            <?xml version='1.0' encoding='utf-8' standalone='yes'?>
            <map>
              <long name="used" value="7812" />
              <long name="limit" value="10000" />
              <int name="average" value="977" />
              <string name="reset">1 déc.</string>
              <long name="updated" value="${NOW}" />
              <string name="last_change">+1 appel depuis le dernier relevé</string>
              <string name="usage_history">${PREV},7811,10000;${NOW},7812,10000;</string>
              <boolean name="session_success" value="false" />
            </map>
            EOF
            adb push /tmp/qp-fixture.xml /data/local/tmp/qp-fixture.xml >/dev/null
            adb shell run-as "$PKG" mkdir -p shared_prefs
            adb shell run-as "$PKG" cp /data/local/tmp/qp-fixture.xml shared_prefs/local-quota.xml
            adb shell am start -n "$PKG/com.quotapulse.monitor.MainActivity"
            sleep 4
            adb exec-out screencap -p > /tmp/quotapulse-visuals/QuotaPulse-06-main-pixel6.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml > /tmp/qp-window.xml
            XY="$(python3 - <<'PY'
            import xml.etree.ElementTree as ET,re
            root=ET.parse('/tmp/qp-window.xml').getroot()
            found=[e.attrib['bounds'] for e in root.iter() if e.attrib.get('content-desc')=='Informations sur mon compte']
            if not found: raise SystemExit('Missing real account button in UI hierarchy')
            b=list(map(int,re.findall(r'\d+',found[0])))
            print((b[0]+b[2])//2,(b[1]+b[3])//2)
            PY
            )"
            adb shell input tap $XY
            sleep 2
            adb exec-out screencap -p > /tmp/quotapulse-visuals/QuotaPulse-06-account-pixel6.png
            adb shell input keyevent 4
            adb shell wm size 720x1560
            adb shell wm density 320
            adb shell am force-stop "$PKG"
            adb shell am start -n "$PKG/com.quotapulse.monitor.MainActivity"
            sleep 3
            adb exec-out screencap -p > /tmp/quotapulse-visuals/QuotaPulse-06-main-compact.png
            test -s /tmp/quotapulse-visuals/QuotaPulse-06-main-pixel6.png
            test -s /tmp/quotapulse-visuals/QuotaPulse-06-account-pixel6.png
            test -s /tmp/quotapulse-visuals/QuotaPulse-06-main-compact.png
            cp /tmp/quotapulse-visuals/*.png "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaPulse-0.6-Android-Emulator-UI-Screenshots
          path: '*.png'
          retention-days: 2
      - name: Publish visual evidence to existing 0.6 QA prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload quotapulse-v0.6.0-qa QuotaPulse-06-main-pixel6.png QuotaPulse-06-account-pixel6.png QuotaPulse-06-main-compact.png --repo "$GITHUB_REPOSITORY" --clobber
