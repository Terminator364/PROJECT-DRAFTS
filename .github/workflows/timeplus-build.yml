name: TimePlus APK build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p TIMEPLUS --no-daemon assembleDebug

      - name: Verify APK
        run: test -s TIMEPLUS/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimePlus-v1.0.0-debug-apk
          path: TIMEPLUS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
