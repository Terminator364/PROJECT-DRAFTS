name: TimePlus V2 build + product gate

on:
  push:
    branches: [main]
    paths:
      - "TIMEPLUS/**"
      - ".github/workflows/timeplus-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate temporal engine matrix
        run: python3 TIMEPLUS/ci_logic_matrix.py

  build-apk:
    needs: logic-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build V2 debug + unsigned release
        run: gradle -p TIMEPLUS --no-daemon assembleDebug assembleRelease
      - name: Verify outputs
        run: |
          test -s TIMEPLUS/app/build/outputs/apk/debug/app-debug.apk
          test -s TIMEPLUS/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Bundle apksigner
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/35.* | sort -V | tail -1)"
          test -x "$BT/apksigner"
          mkdir -p /tmp/timeplus-signing-tools/lib
          cp "$BT/apksigner" /tmp/timeplus-signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/timeplus-signing-tools/lib/
          tar -C /tmp -czf /tmp/timeplus-signing-tools-linux.tgz timeplus-signing-tools
      - uses: actions/upload-artifact@v4
        with:
          name: TimePlus-2.0.0-debug
          path: TIMEPLUS/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: TimePlus-2.0.0-unsigned-release
          path: TIMEPLUS/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: TimePlus-android-signing-tools
          path: /tmp/timeplus-signing-tools-linux.tgz
          retention-days: 7

  ui-emulator:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TimePlus-2.0.0-debug
          path: ci-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: V2 multi-state visual + interaction gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash TIMEPLUS/ci_visual_gate.sh
      - name: Upload V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TimePlus-2.0.0-ui-evidence
          path: ui-evidence
          retention-days: 7
