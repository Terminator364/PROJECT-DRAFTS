name: TimePlus APK build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and unsigned release
        run: gradle -p TIMEPLUS --no-daemon assembleDebug assembleRelease

      - name: Verify outputs
        run: |
          test -s TIMEPLUS/app/build/outputs/apk/debug/app-debug.apk
          test -s TIMEPLUS/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Bundle Android signing tools
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/35.* | sort -V | tail -1)"
          test -x "$BT/apksigner"
          mkdir -p /tmp/timeplus-signing-tools/lib
          cp "$BT/apksigner" /tmp/timeplus-signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/timeplus-signing-tools/lib/
          tar -C /tmp -czf /tmp/timeplus-signing-tools-linux.tgz timeplus-signing-tools

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TimePlus-debug
          path: TIMEPLUS/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: TimePlus-unsigned-release
          path: TIMEPLUS/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: TimePlus-android-signing-tools
          path: /tmp/timeplus-signing-tools-linux.tgz
          retention-days: 7
