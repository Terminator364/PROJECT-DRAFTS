name: BCP Remote V4 - ADB USB preview APK
on:
  push:
    branches: [work/bcp-remote-v4-adb-usb-20261023]
    paths:
      - "BCP_REMOTE_V4/**"
      - ".github/workflows/bcp-remote-v4-preview.yml"
  workflow_dispatch:
  pull_request:
    branches: [work/usb-phone-rescue-lab-2026-10-12]
    paths:
      - "BCP_REMOTE_V4/**"
      - ".github/workflows/bcp-remote-v4-preview.yml"
permissions:
  contents: read
jobs:
  qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify and extract frozen R3.3 parent
        shell: bash
        run: |
          set -euo pipefail
          base64 -d USB-PHONE-RESCUE-LAB/r3_3-source-bundle.tar.gz.base64 >/tmp/r33.tar.gz
          echo "52e56c2c5be8a2ab0703fe78c43cc7f61ad510851e4975bbfbab61e94d8e5fbd  /tmp/r33.tar.gz" | sha256sum -c -
          tar -tzf /tmp/r33.tar.gz | grep '^r33/android/app/build.gradle$'
          tar -xzf /tmp/r33.tar.gz
      - name: Apply isolated V4 changes and test
        shell: bash
        run: |
          set -euo pipefail
          python3 BCP_REMOTE_V4/patch_v4_android.py r33
          python3 -m unittest discover -s r33/tests -q
          python3 -m py_compile BCP_REMOTE_V4/windows/adb_guardian.py
          python3 BCP_REMOTE_V4/tests/test_v4_contract.py r33
          grep -F 'versionCode 6' r33/android/app/build.gradle
          grep -F 'awaitAdb' r33/android/app/src/main/java/com/blessing/rescuebridge/MainActivity.java
      - name: Android SDK API 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned V4 candidate
        working-directory: r33/android
        run: gradle --no-daemon --max-workers 2 :app:assembleRelease
      - name: APK metadata / signature evidence
        shell: bash
        run: |
          set -euo pipefail
          APK="r33/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-package.txt
          grep -F "name='com.blessing.rescuebridge'" apk-package.txt
          grep -F "versionCode='6'" apk-package.txt
          sha256sum "$APK" | tee apk-unsigned-sha256.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-signing-tool.jar
          sha256sum apk-signing-tool.jar > signing-tool-sha256.txt
          echo "UNSIGNED candidate. Durable signing key must remain on MBMPC. Physical Samsung validation pending." > RELEASE_STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BCP-Remote-V4-ADB-UNSIGNED-ONLY
          path: |
            r33/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apk-package.txt
            apk-unsigned-sha256.txt
            apk-signing-tool.jar
            signing-tool-sha256.txt
            RELEASE_STATUS.txt
          retention-days: 7
          if-no-files-found: error