name: BookHarvester V1.4.8 one-click Windows release gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-once:
    runs-on: windows-latest
    timeout-minutes: 11
    defaults:
      run:
        working-directory: experiments/bookharvester-v148/unpacked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source ZIP checksum and unpack
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference='Stop'
          $zip='experiments/Blessing-BookHarvester-V1.4.8-Patched-Sources.zip'
          $sha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'c53cef046e7d423955bfc62558e96fc91cdea4d06528440a577c2b090f351198'){throw "Source checksum mismatch: $sha"}
          New-Item -ItemType Directory 'experiments/bookharvester-v148/unpacked' -Force | Out-Null
          Expand-Archive $zip 'experiments/bookharvester-v148/unpacked' -Force
      - name: Install dependencies for QA and EXE
        shell: pwsh
        run: python -m pip install -r requirements-qa.txt
      - name: Run transactional one-click, three random chapters, recovery and integrity tests
        shell: pwsh
        run: python -m pytest -q tests --junitxml=qa-v148.xml
      - name: Test Chromium extension state machine
        shell: pwsh
        run: |
          node tests/edge_worker_test.cjs
          if($LASTEXITCODE -ne 0){throw 'Chromium worker test failed'}
          node tests/edge_random_test.cjs
          if($LASTEXITCODE -ne 0){throw 'Chromium random 3 test failed'}
          node tests/edge_identity_test.cjs
          if($LASTEXITCODE -ne 0){throw 'Chapter identity test failed'}
      - name: Verify public-domain three-book archive simulation
        shell: pwsh
        run: python three_books_realtext_e2e.py --root e2e-v148
      - name: Build a self-contained desktop program
        shell: pwsh
        run: pyinstaller --clean --noconfirm --onedir --windowed --name BlessingBookHarvester bookharvester.py
      - name: Smoke test actual EXE, UI and one-click logic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Resolve-Path '.\dist\BlessingBookHarvester\BlessingBookHarvester.exe'
          $report=Join-Path $PWD 'real-gui-v148.json'
          $p=Start-Process -FilePath $exe -ArgumentList @('--self-test','--ui-probe','--ui-layout-probe','--pipeline-probe','--self-test-report',('"' + $report + '"')) -PassThru
          if(-not $p.WaitForExit(45000)){try{$p.Kill()}catch{};throw 'Executable UI timeout'}
          if($p.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)){throw 'Windows executable check failed'}
          $j=Get-Content -Raw $report | ConvertFrom-Json
          if($j.ok -ne $true -or $j.ui -ne 'ok' -or $j.ui_layout -ne 'ok' -or $j.pipeline -ne 'ok' -or $j.version -ne '1.4.8-oneclick-transactional'){throw 'One-click UI/runtime proof missing'}
      - name: Assemble signed-by-SHA release and test installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory 'release' -Force | Out-Null
          Copy-Item '.\dist\BlessingBookHarvester' '.\release\BookHarvesterApp' -Recurse
          Copy-Item '.\edge-extension' '.\release\Edge-Extension' -Recurse
          Copy-Item '.\Install-Portable.ps1','.\Install-Portable.bat','.\README.md' '.\release'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\release\Install-Portable.ps1'
          if($LASTEXITCODE -ne 0){throw 'Installer failed'}
          $target=Join-Path $env:LOCALAPPDATA 'BlessingBookHarvester\app-v1.4.8\BlessingBookHarvester.exe'
          $link=Join-Path ([Environment]::GetFolderPath('Desktop')) 'Blessing BookHarvester.lnk'
          if(!(Test-Path $target) -or !(Test-Path $link)){throw 'Program or desktop shortcut missing'}
          $actual=(New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
          if($actual -ne $target){throw 'Desktop shortcut wrong version'}
          if(!(Test-Path (Join-Path $env:LOCALAPPDATA 'BlessingBookHarvester\Chromium-Extension\manifest.json'))){throw 'Browser extension missing'}
          (Get-FileHash '.\release\BookHarvesterApp\BlessingBookHarvester.exe' -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content '.\release\SHA256.txt' -Encoding ASCII
          Compress-Archive '.\release\*' '.\Blessing-BookHarvester-Windows-V1.4.8.zip' -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BookHarvester-Windows-OneClick-V1.4.8
          path: |
            experiments/bookharvester-v148/unpacked/Blessing-BookHarvester-Windows-V1.4.8.zip
            experiments/bookharvester-v148/unpacked/qa-v148.xml
            experiments/bookharvester-v148/unpacked/e2e-v148/qa-report.json
            experiments/bookharvester-v148/unpacked/real-gui-v148.json
          retention-days: 6
