name: RIZ112 - 10 scenarios x 44 canonical replay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riz112-sim-prestart-10-verify.yml'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/MATRICE_44x10.csv'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/rejouer_sur_moteur_canonique.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          persist-credentials: true
      - name: Run precise 10 x 44 canonical simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile MOTEUR-BLESSING/labs/RIZ112/pret0_focus/ic44_v2.py
          python3 MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/rejouer_sur_moteur_canonique.py
      - name: Check canonical replay against committed received values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          rel='MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/RECU_CANONIQUE_10x44.json'
          expected=json.loads(subprocess.check_output(['git','show','HEAD:'+rel],text=True))
          observed=json.loads(Path(rel).read_text(encoding='utf-8'))
          assert expected['inputs_total']==observed['total_inputs']==440
          assert len(expected['results'])==len(observed['results'])==10
          for a,b in zip(expected['results'],observed['results']):
              assert a['scenario']==b['scenario']
              assert abs(a['IC_DEMO_PCT']-b['IC_DEMO_PCT'])<1e-9
          assert expected['scientific_IC'] is None and observed['scientific_ic'] is None
          print('CANONICAL_REPLAY_MATCH',10,'inputs',440)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RIZ112-CANONICAL-10x44-RECEIPT
          path: MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/RECU_CANONIQUE_10x44.json
          retention-days: 30
