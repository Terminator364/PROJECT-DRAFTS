name: RIZ112 - 10 scenarios x 44 canonical replay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riz112-sim-prestart-10-verify.yml'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/MATRICE_44x10.csv'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/rejouer_sur_moteur_canonique.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          persist-credentials: true
      - name: Run precise 10 x 44 canonical simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile MOTEUR-BLESSING/labs/RIZ112/pret0_focus/ic44_v2.py
          python3 MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/rejouer_sur_moteur_canonique.py
      - uses: actions/upload-artifact@v4
        with:
          name: RIZ112-CANONICAL-10x44-RECEIPT
          path: MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/RECU_CANONIQUE_10x44.json
          retention-days: 30
      - name: Persist immutable report to Github
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MOTEUR-BLESSING/labs/RIZ112/pret0_focus/SIM_PRET0_10_V2_20261023/RECU_CANONIQUE_10x44.json
          if git diff --cached --quiet; then
            echo "UNCHANGED_CANONICAL_RESULT"
            exit 0
          fi
          git commit -m "data(riz112): canonical 10x44 simulation readback [skip ci]"
          # Runner has pre-existing tracked build dirt; its private workspace may be reset.
          # The generated canonical receipt is ALREADY in HEAD, so it is safe here.
          git reset --hard HEAD
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 1
          done
          echo "PUSH_NOT_CONFIRMED" >&2
          exit 1
