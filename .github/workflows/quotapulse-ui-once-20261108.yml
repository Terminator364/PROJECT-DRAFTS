name: QuotaPulse one-shot emulator visual QA
on:
  push:
    branches: [quotapulse-ui-lab-20261108]
    paths: [.github/workflows/quotapulse-ui-once-20261108.yml]
permissions:
  contents: write
jobs:
  android_emulator_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and test debug fixture, install on actual Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            gradle --no-daemon --console=plain -p QUOTAPULSE/android testDebugUnitTest assembleDebug
            adb install -r QUOTAPULSE/android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p qa-screenshots
            adb shell wm size 360x760
            adb shell wm density 400
            adb shell am start -n com.quotapulse.monitor.stable/com.quotapulse.monitor.MainActivity --ez qp_visual_fixture true
            sleep 6
            adb exec-out screencap -p > qa-screenshots/phone-small.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml qa-screenshots/window-small.xml >/dev/null
            python3 - <<'PY'
            import re,subprocess
            xml=open('qa-screenshots/window-small.xml').read()
            for k in ['Informations sur mon compte','Mon compte']:
              m=re.search('content-desc="'+re.escape(k)+r'".*?bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',xml)
              if m:
                x=(int(m[1])+int(m[3]))//2
                y=(int(m[2])+int(m[4]))//2
                subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
                print('ACCOUNT_TAPPED_AT',x,y)
                break
            else:
              print('WARNING_ACCOUNT_NOT_FOUND_IN_ACCESSIBILITY_TREE')
            PY
            sleep 3
            adb exec-out screencap -p > qa-screenshots/account-small.png
            adb shell input keyevent KEYCODE_BACK
            adb shell wm size 412x915
            adb shell wm density 420
            sleep 4
            adb exec-out screencap -p > qa-screenshots/phone-normal.png
            adb shell dumpsys activity activities | grep 'mResumedActivity\|topResumedActivity' | tail -n 3 || true
            file qa-screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaPulse-emulator-ui-shots
          path: qa-screenshots/
          retention-days: 2
      - name: Publish public dummy-data screenshots for audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="quotapulse-ui-fixture-20261108"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --prerelease --title "QuotaPulse UI emulator screenshots - FIXTURE ONLY" --notes "Images from Android API 35 emulator with synthetic demo values only. No user data, no credentials, no live quota checks."
          fi
          gh release upload "$TAG" qa-screenshots/phone-small.png qa-screenshots/account-small.png qa-screenshots/phone-normal.png --clobber --repo "$GITHUB_REPOSITORY"
