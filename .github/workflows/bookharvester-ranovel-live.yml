name: BookHarvester - LIVE Ranovel 3 chapters
on:
  workflow_dispatch:
  push:
    branches: [feat/bookharvester-ranovel-live-20261012]
    paths:
      - '.github/workflows/bookharvester-ranovel-live.yml'
permissions:
  contents: read
jobs:
  real-pages:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: experiments/bookharvester-live-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare actual BookHarvester extraction engine
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory 'experiments/bookharvester-live-check' -Force | Out-Null
          Expand-Archive -LiteralPath 'experiments/Blessing-BookHarvester-Sources-V1.1.zip' -DestinationPath 'experiments/bookharvester-live-check' -Force
          Copy-Item 'experiments/bookharvester-ranovel-live-probe.py' 'experiments/bookharvester-live-check/probe.py'
      - name: Install lightweight reader / verifier dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt "pypdf>=5,<7"
      - name: Attempt 3 real source chapters and verify EPUB/PDF
        shell: pwsh
        run: |
          python probe.py
          if ($LASTEXITCODE -ne 0) { throw "Live website compatibility not proven (exit $LASTEXITCODE)" }
      - name: Report metadata only - NEVER archive novel text
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookharvester-ranovel-live-report
          path: experiments/bookharvester-live-check/live-probe-report.json
          if-no-files-found: warn
          retention-days: 4
