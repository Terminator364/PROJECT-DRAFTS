name: QuotaPulse 0.6 one-shot public QA
on:
  push:
    branches: [quotapulse-v06-qa-20261108]
    paths: [.github/workflows/quotapulse-v06-one-shot.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure targeted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$S"
          "$S" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run Java tests and compile debug
        run: gradle --no-daemon --console=plain -p QUOTAPULSE/android clean testDebugUnitTest assembleDebug
      - name: Audit QA binary
        shell: bash
        run: |
          set -euo pipefail
          f="QUOTAPULSE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$f"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$f"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$f" | grep "^package:"
          sha256sum "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaPulse-0.6.0-debug-QA-DO-NOT-INSTALL-AS-UPGRADE
          path: QUOTAPULSE/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2
      - name: Publish public QA (debug signing, not a production upgrade)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=quotapulse-v0.6.0-qa
          f=QUOTAPULSE/android/app/build/outputs/apk/debug/app-debug.apk
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --prerelease --title "QuotaPulse v0.6.0 QA (debug only)" --notes "Verification build only. DEBUG-SIGNED APK; NOT an in-place upgrade. Public repo contains no production signing credentials."
          fi
          gh release upload "$tag" "$f#QuotaPulse-v0.6.0-QA-debug.apk" --repo "$GITHUB_REPOSITORY" --clobber
