name: RIZ112 pre-T0 44/44 smoke verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/bridge44.py'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/test_bridge44.py'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/pipeline44.py MOTEUR-BLESSING/labs/RIZ112/pret0_focus/ic44_v2.py'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/test_pipeline44.py'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/ic44_v2.py'
      - 'MOTEUR-BLESSING/labs/RIZ112/pret0_focus/test_ic44_v2.py'
      - '.github/workflows/riz112-bridge44-verify.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Offline Python pre-T0 44-route checks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python compile
        run: python3 -m py_compile MOTEUR-BLESSING/labs/RIZ112/pret0_focus/bridge44.py MOTEUR-BLESSING/labs/RIZ112/pret0_focus/pipeline44.py
      - name: All counterfactual and temporal tests
        run: python3 -m unittest discover -s MOTEUR-BLESSING/labs/RIZ112/pret0_focus -p 'test_*.py' -v
      - name: Verify actual canonical Step6 fixture
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('MOTEUR-BLESSING/labs/RIZ112')
          sys.path.insert(0,str(root/'pret0_focus'))
          from bridge44 import evaluate44
          from pipeline44 import run44
          from ic44_v2 import simulate,audit_44
          from test_ic44_v2 import ALT
          p=json.loads((root/'step6/examples/A_couvercle_ajuste_112.json').read_text(encoding='utf-8'))
          r=evaluate44(p)
          assert r['routed_count']==44
          assert len(r['routes'])==44
          assert r['scientific_ic_percent'] is None
          assert r['routes']['035']['output'] is not None
          print('ACTUAL_STEP6_FIXTURE_ROUTES',r['routed_count'])
          print('ACTUAL_STEP6_FIXTURE_EVALUATED',r['evaluated_count'])
          combined=run44(p,n_draws=100,seed=20261023)
          assert combined['prestart_routed']==44
          assert combined['scientific_ic_percent'] is None
          print('STEP9_GATED_STATUS',combined['status'])
          print('STEP9_QSTAR_DEMO',combined['ic_demo_percent'])
          synthetic=json.loads((root/'pret0_focus'/ 'nonexistent_file_placeholder.json').read_text()) if False else None
          # Historical fixture has 20 UNKNOWN input states: real engine abstains.
          demo=simulate(p)
          assert demo['IC_DEMO_PCT'] is None
          print('RIZ44_HISTORICAL_UNKNOWN_ABSTAINS',len(demo['missing']))
          from test_bridge44 import packet as filled_test
          r=audit_44(filled_test(),ALT)
          assert r['IC_demo_changed_count']==44
          print('RIZ44_ICE_CHANGED',r['IC_demo_changed_count'])
          PY
