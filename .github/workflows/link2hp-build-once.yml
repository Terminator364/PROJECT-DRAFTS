name: LINK2HP Android 1.3 - connexion LAN renforcée
on:
  workflow_dispatch:
  # Checkpoint corrigé Android v1.1 du 10-11-2026 : scan et sélection Wi-Fi du HP.
  # Les push habituels du projet ne lancent pas de CI.
  push:
    branches: ["link2hp/v13-connectivity-20261111"]
    paths: [".github/workflows/link2hp-build-once.yml"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: SDK Android 35
        run: |
          echo "sdk.dir=$ANDROID_HOME" > LINK2HP/android/local.properties
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR" || { echo 'sdkmanager introuvable'; exit 1; }
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilation APK Android
        working-directory: LINK2HP/android
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LINK2HP-Android-v1.3-debug-APK
          path: LINK2HP/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
